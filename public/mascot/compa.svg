<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Compa: friendly compass-explorer mascot, original character for LingoTrail -->
  <ellipse cx="100" cy="182" rx="46" ry="8" fill="#0B1F22" opacity="0.08"/>
  <!-- backpack -->
  <rect x="132" y="90" width="34" height="46" rx="12" fill="#D99A00"/>
  <rect x="138" y="98" width="22" height="10" rx="4" fill="#F2B705"/>
  <!-- body: rounded compass shell -->
  <circle cx="100" cy="108" r="62" fill="#0F7A72"/>
  <circle cx="100" cy="108" r="62" fill="url(#compa-grad)" fill-opacity="0.25"/>
  <circle cx="100" cy="108" r="49" fill="#FAF7F0"/>
  <!-- compass needle -->
  <path d="M100 72 L112 108 L100 144 L88 108 Z" fill="#FF6B5B"/>
  <path d="M100 72 L112 108 L100 108 Z" fill="#E5503F"/>
  <path d="M100 144 L88 108 L100 108 Z" fill="#0B5D5D"/>
  <circle cx="100" cy="108" r="8" fill="#F2B705" stroke="#0B1F22" stroke-width="2"/>
  <!-- tick marks -->
  <circle cx="100" cy="66" r="2.5" fill="#0B5D5D"/>
  <circle cx="100" cy="150" r="2.5" fill="#0B5D5D"/>
  <circle cx="142" cy="108" r="2.5" fill="#0B5D5D"/>
  <circle cx="58" cy="108" r="2.5" fill="#0B5D5D"/>
  <!-- eyes on the shell rim -->
  <circle cx="78" cy="88" r="7" fill="#0B1F22"/>
  <circle cx="80.5" cy="85.5" r="2" fill="white"/>
  <circle cx="122" cy="88" r="7" fill="#0B1F22"/>
  <circle cx="124.5" cy="85.5" r="2" fill="white"/>
  <!-- smile -->
  <path d="M86 128 Q100 138 114 128" stroke="#0B1F22" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- arms -->
  <path d="M42 118 Q28 108 30 92" stroke="#0F7A72" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="30" cy="90" r="9" fill="#0F7A72"/>
  <path d="M158 118 Q172 108 170 92" stroke="#0F7A72" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="170" cy="90" r="9" fill="#0F7A72"/>
  <!-- legs -->
  <rect x="80" y="158" width="14" height="22" rx="7" fill="#0B5D5D"/>
  <rect x="106" y="158" width="14" height="22" rx="7" fill="#0B5D5D"/>
  <ellipse cx="87" cy="182" rx="12" ry="6" fill="#0B1F22"/>
  <ellipse cx="113" cy="182" rx="12" ry="6" fill="#0B1F22"/>
  <defs>
    <radialGradient id="compa-grad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(80 80) rotate(45) scale(90)">
      <stop stop-color="#F2B705"/>
      <stop offset="1" stop-color="#0F7A72" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
